AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 FTP Server with CloudWatch Logging and S3 Integration'

Parameters:
  ServerEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Retired by default. Enabling EC2 requires an explicitly approved rebuild.

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type

  S3BucketName:
    Type: String
    Description: S3 bucket for FTP file uploads

  FTPUser:
    Type: String
    Description: FTP username
    NoEcho: false

  FTPPassword:
    Type: String
    Description: FTP password
    NoEcho: true

  KeyName:
    Type: String
    Description: EC2 Key Pair name (optional, not used for external access)
    Default: ''

  DomainName:
    Type: String
    Description: Domain name to create/update in Route53 (optional)
    Default: ''

  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID (required if DomainName is provided)
    Default: ''

  SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for CloudWatch alarm notifications (pre-created, 
      static)
    Default: ''

Conditions:
  IsFTPServerEnabled: !Equals [!Ref ServerEnabled, 'true']
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]
  HasDomainName: !Not [!Equals [!Ref DomainName, '']]
  HasSNSTopic: !Not [!Equals [!Ref SNSTopicArn, '']]

Resources:
  # VPC Configuration
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
      - Key: Name
        Value: FTP-Server-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Name
        Value: FTP-Server-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
      - Key: Name
        Value: FTP-Server-PublicSubnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
      - Key: Name
        Value: FTP-Server-PublicRouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Security Group - Only FTP port open
  FTPSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for FTP server - only port 29720
      VpcId: !Ref VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 29720
        ToPort: 29720
        CidrIp: 0.0.0.0/0
        Description: FTP Control Port
        # Passive FTP ports
      - IpProtocol: tcp
        FromPort: 21000
        ToPort: 21100
        CidrIp: 0.0.0.0/0
        Description: FTP Passive Ports
      SecurityGroupEgress:
      - IpProtocol: -1
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value: FTP-Server-SG

  # EFS Security Group - allows NFS traffic from EC2
  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EFS - allows NFS from FTP server
      VpcId: !Ref VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 2049
        ToPort: 2049
        SourceSecurityGroupId: !Ref FTPSecurityGroup
        Description: NFS from FTP Server
      Tags:
      - Key: Name
        Value: FTP-EFS-SG

  # EFS FileSystem for FTP staging
  FTPFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      Encrypted: true
      FileSystemTags:
      - Key: Name
        Value: FTP-Staging-EFS

  # EFS Mount Target in Public Subnet
  EFSMountTarget:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FTPFileSystem
      SubnetId: !Ref PublicSubnet
      SecurityGroups:
      - !Ref EFSSecurityGroup

  # IAM Role for EC2
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
      - PolicyName: S3Access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            - s3:ListBucket
            Resource:
            - !Sub 'arn:aws:s3:::${S3BucketName}'
            - !Sub 'arn:aws:s3:::${S3BucketName}/*'
      - PolicyName: CloudWatchLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            - logs:DescribeLogStreams
            Resource: '*'
      - PolicyName: Route53Access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - route53:ListResourceRecordSets
            - route53:ChangeResourceRecordSets
            - route53:GetChange
            Resource: '*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - !Ref EC2Role

  # CloudWatch Log Group
  FTPLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ec2/ftp-server
      RetentionInDays: 7

  # CloudWatch Alarm for EFS Storage > 10GB for 1 day
  FTPServer:
    Type: AWS::EC2::Instance
    Condition: IsFTPServerEnabled
    DependsOn: EFSMountTarget
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub '{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/arm64/hvm/ebs-gp2/ami-id}}'
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      IamInstanceProfile: !Ref EC2InstanceProfile
      NetworkInterfaces:
      - AssociatePublicIpAddress: true
        DeviceIndex: 0
        GroupSet:
        - !Ref FTPSecurityGroup
        SubnetId: !Ref PublicSubnet
      BlockDeviceMappings:
      - DeviceName: /dev/sda1
        Ebs:
          VolumeType: gp3
          VolumeSize: 10
          DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Log everything to a file for debugging
          exec > >(tee -a /var/log/userdata.log)
          exec 2>&1

          echo "========================================="
          echo "Starting UserData script execution"
          echo "Timestamp: $(date)"
          echo "========================================="

          # Update system
          echo "Updating system packages..."
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get upgrade -y

          # Install required packages
          echo "Installing required packages..."
          apt-get install -y vsftpd awscli wget at nfs-common
          echo "Packages installed successfully"

          # Stop vsftpd immediately - it auto-starts with default config on install
          # We need to stop it so we can configure it properly before starting
          echo "Stopping vsftpd (auto-started by apt with default config)..."
          systemctl stop vsftpd
          systemctl disable vsftpd

          # Enable atd service for scheduled one-time jobs
          systemctl enable atd
          systemctl start atd

          # Install CloudWatch agent
          echo "Installing CloudWatch agent..."
          wget https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/arm64/latest/amazon-cloudwatch-agent.deb
          dpkg -i -E ./amazon-cloudwatch-agent.deb
          rm -f ./amazon-cloudwatch-agent.deb
          echo "CloudWatch agent installed"

          # Ensure ftp system user exists (vsftpd needs this for internal operations)
          echo "Checking for ftp system user..."
          if ! id ftp &>/dev/null; then
              echo "Creating ftp system user..."
              useradd -r -s /usr/sbin/nologin ftp || echo "ftp user may already exist"
          else
              echo "ftp system user already exists"
          fi
          # Verify nobody user exists too
          echo "Checking for nobody user..."
          id nobody || echo "nobody user not found - this may cause issues"

          # Create FTP user
          echo "Creating FTP user: ${FTPUser}"
          useradd -m -s /bin/bash ${FTPUser}
          # Debug: Show password length (not the password itself)
          PWD_LEN=$(echo -n "${FTPPassword}" | wc -c)
          echo "Password length received: $PWD_LEN characters"
          # Use SHA-512 hash explicitly (yescrypt $y$ may not work with vsftpd/PAM)
          echo "${FTPUser}:${FTPPassword}" | chpasswd -c SHA512
          CHPASSWD_RESULT=$?
          # Create FTP directory and mount EFS
          mkdir -p /home/${FTPUser}/ftp
          EFS_DNS="${FTPFileSystem}.efs.${AWS::Region}.amazonaws.com"

          # Wait for EFS DNS
          for i in $(seq 1 12); do nslookup $EFS_DNS >/dev/null 2>&1 && break; sleep 5; done

          # Mount EFS
          echo "$EFS_DNS:/ /home/${FTPUser}/ftp nfs4 nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev 0 0" >> /etc/fstab
          mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport $EFS_DNS:/ /home/${FTPUser}/ftp || { sleep 10; mount -a; }

          mkdir -p /home/${FTPUser}/ftp/upload
          chown -R ${FTPUser}:${FTPUser} /home/${FTPUser}/ftp
          chmod -R 755 /home/${FTPUser}/ftp

          # Configure vsftpd - write config without leading whitespace
          echo "anonymous_enable=NO" > /etc/vsftpd.conf
          echo "local_enable=YES" >> /etc/vsftpd.conf
          echo "write_enable=YES" >> /etc/vsftpd.conf
          echo "local_umask=022" >> /etc/vsftpd.conf
          echo "dirmessage_enable=YES" >> /etc/vsftpd.conf
          echo "xferlog_enable=YES" >> /etc/vsftpd.conf
          echo "xferlog_file=/var/log/vsftpd.log" >> /etc/vsftpd.conf
          echo "xferlog_std_format=YES" >> /etc/vsftpd.conf
          echo "connect_from_port_20=NO" >> /etc/vsftpd.conf
          echo "listen=YES" >> /etc/vsftpd.conf
          echo "listen_ipv6=NO" >> /etc/vsftpd.conf
          echo "listen_port=29720" >> /etc/vsftpd.conf
          echo "pam_service_name=vsftpd" >> /etc/vsftpd.conf
          # Enable userlist as a whitelist (deny=NO means allow users in list)
          echo "userlist_enable=YES" >> /etc/vsftpd.conf
          echo "userlist_deny=NO" >> /etc/vsftpd.conf
          echo "userlist_file=/etc/vsftpd.user_list" >> /etc/vsftpd.conf
          echo "tcp_wrappers=NO" >> /etc/vsftpd.conf
          echo "pasv_enable=YES" >> /etc/vsftpd.conf
          echo "pasv_min_port=21000" >> /etc/vsftpd.conf
          echo "pasv_max_port=21100" >> /etc/vsftpd.conf
          echo "pasv_address=PUBLIC_IP_PLACEHOLDER" >> /etc/vsftpd.conf
          echo "chroot_local_user=YES" >> /etc/vsftpd.conf
          echo "allow_writeable_chroot=YES" >> /etc/vsftpd.conf
          echo 'local_root=/home/$USER/ftp' >> /etc/vsftpd.conf
          echo 'user_sub_token=$USER' >> /etc/vsftpd.conf
          echo "seccomp_sandbox=NO" >> /etc/vsftpd.conf

          # Get public IP and update config
          echo "Retrieving public IP address..."
          PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)

          if [ -z "$PUBLIC_IP" ]; then
              echo "ERROR: Failed to retrieve public IP address"
              exit 1
          fi

          echo "Public IP: $PUBLIC_IP"
          echo "Updating vsftpd configuration with public IP..."
          sed -i "s/PUBLIC_IP_PLACEHOLDER/$PUBLIC_IP/" /etc/vsftpd.conf

          # Verify the substitution worked
          if grep -q "PUBLIC_IP_PLACEHOLDER" /etc/vsftpd.conf; then
              echo "ERROR: Failed to replace PUBLIC_IP_PLACEHOLDER in vsftpd.conf"
              exit 1
          fi

          echo "vsftpd configuration updated successfully"

          # Update/Create Route53 DNS record if DOMAIN_NAME is provided
          DOMAIN_NAME="${DomainName}"
          HOSTED_ZONE_ID="${HostedZoneId}"

          if [ ! -z "$DOMAIN_NAME" ] && [ ! -z "$HOSTED_ZONE_ID" ]; then
              echo "Managing Route53 DNS record for $DOMAIN_NAME..."

              # Check if the record exists to provide better logging
              echo "Checking if DNS record exists for $DOMAIN_NAME..."
              EXISTING_RECORD=$(aws route53 list-resource-record-sets \
                  --hosted-zone-id "$HOSTED_ZONE_ID" \
                  --query "ResourceRecordSets[?Name=='$DOMAIN_NAME.' && Type=='A'].ResourceRecords[0].Value" \
                  --output text 2>/dev/null)

              if [ ! -z "$EXISTING_RECORD" ] && [ "$EXISTING_RECORD" != "None" ]; then
                  echo "Found existing A record pointing to: $EXISTING_RECORD"
                  echo "Will update to point to: $PUBLIC_IP"
                  ACTION_TYPE="Updating"
              else
                  echo "No existing A record found"
                  echo "Will create new A record pointing to: $PUBLIC_IP"
                  ACTION_TYPE="Creating"
              fi

              # Create change batch JSON (UPSERT will create if not exists, update if exists)
              cat > /tmp/route53-change.json << EOFROUTE53
          {
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "$DOMAIN_NAME",
                "Type": "A",
                "TTL": 300,
                "ResourceRecords": [{"Value": "$PUBLIC_IP"}]
              }
            }]
          }
          EOFROUTE53

              # Apply the change
              echo "$ACTION_TYPE A record for $DOMAIN_NAME..."
              CHANGE_ID=$(aws route53 change-resource-record-sets \
                  --hosted-zone-id "$HOSTED_ZONE_ID" \
                  --change-batch file:///tmp/route53-change.json \
                  --query 'ChangeInfo.Id' \
                  --output text)

              if [ $? -eq 0 ]; then
                  ACTION_LOWER=$(echo "$ACTION_TYPE" | tr '[:upper:]' '[:lower:]')
                  echo "Successfully $ACTION_LOWER DNS record. Change ID: $CHANGE_ID"

                  # Wait for the change to be applied
                  echo "Waiting for DNS change to propagate..."
                  aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
                  echo "DNS record is now active! $DOMAIN_NAME -> $PUBLIC_IP"
              else
                  ACTION_LOWER=$(echo "$ACTION_TYPE" | tr '[:upper:]' '[:lower:]')
                  echo "ERROR: Failed to $ACTION_LOWER DNS record"
              fi

              # Clean up
              rm -f /tmp/route53-change.json
          else
              echo "Skipping Route53 DNS update - DOMAIN_NAME or HOSTED_ZONE_ID not provided"
          fi

          # Add FTP user to allowed users
          echo "${FTPUser}" > /etc/vsftpd.user_list
          echo "User list contents:"
          cat /etc/vsftpd.user_list

          # Fix PAM config for vsftpd - use standard pam_unix.so authentication
          echo "Configuring PAM for vsftpd..."
          echo "# vsftpd PAM configuration" > /etc/pam.d/vsftpd
          echo "auth    required        pam_listfile.so item=user sense=deny file=/etc/ftpusers onerr=succeed" >> /etc/pam.d/vsftpd
          echo "auth    required        pam_unix.so" >> /etc/pam.d/vsftpd
          echo "account required        pam_unix.so" >> /etc/pam.d/vsftpd
          echo "session required        pam_unix.so" >> /etc/pam.d/vsftpd
          # Remove FTP user from deny list if present
          [ -f /etc/ftpusers ] && sed -i "/^${FTPUser}$/d" /etc/ftpusers

          # Start vsftpd
          systemctl start vsftpd
          systemctl enable vsftpd

          # Disable firewalld (using EC2 Security Group instead)
          systemctl stop firewalld 2>/dev/null || true
          systemctl disable firewalld 2>/dev/null || true

          # Create CloudWatch agent config
          cat > /opt/aws/amazon-cloudwatch-agent/etc/config.json << 'EOF'
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/userdata.log",
                      "log_group_name": "/aws/ec2/ftp-server",
                      "log_stream_name": "userdata-{instance_id}"
                    },
                    {
                      "file_path": "/var/log/vsftpd.log",
                      "log_group_name": "/aws/ec2/ftp-server",
                      "log_stream_name": "vsftpd-{instance_id}"
                    },
                    {
                      "file_path": "/var/log/ftp-to-s3.log",
                      "log_group_name": "/aws/ec2/ftp-server",
                      "log_stream_name": "ftp-to-s3-{instance_id}"
                    }
                  ]
                }
              }
            }
          }
          EOF

          # Start CloudWatch agent
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config \
            -m ec2 \
            -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

          # Create S3 sync script with retry logic and lock file
          cat > /usr/local/bin/ftp-to-s3.sh << 'EOFSCRIPT'
          #!/bin/bash

          FTP_DIR="/home/${FTPUser}/ftp"
          S3_BUCKET="${S3BucketName}"
          LOG_FILE="/var/log/ftp-to-s3.log"
          LOG_GROUP="/aws/ec2/ftp-server"
          LOG_STREAM="ftp-to-s3-transfers"
          LOCK_FILE="/tmp/ftp-to-s3.lock"
          MAX_RETRIES=3

          log() { echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" >> $LOG_FILE; }

          log_to_cloudwatch() {
              local message="$1"
              aws logs put-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" \
                  --log-events "timestamp=$(date +%s000),message=$message" 2>/dev/null || true
          }

          # Exit if another instance is running (with stale lock cleanup after 30 min)
          if [ -f "$LOCK_FILE" ]; then
              lock_age=$(( $(date +%s) - $(stat -c %Y "$LOCK_FILE" 2>/dev/null || echo 0) ))
              if [ $lock_age -lt 1800 ]; then
                  log "Another sync is running (lock age: ${!lock_age}s), exiting"
                  exit 0
              fi
              log "Removing stale lock file (age: ${!lock_age}s)"
          fi
          echo $$ > "$LOCK_FILE"
          trap "rm -f $LOCK_FILE" EXIT

          aws logs create-log-stream --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" 2>/dev/null || true
          log "Starting FTP to S3 sync"

          find $FTP_DIR -type f -mmin +20 | while read file; do
              [ -f "$file" ] || continue
              original_filename=$(basename "$file")
              relative_path=$(echo "$file" | sed "s|^$FTP_DIR/||")
              relative_dir=$(dirname "$relative_path")
              file_date=$(date -r "$file" '+%Y-%m-%d')

              if [ "$relative_dir" = "." ] || [ -z "$relative_dir" ]; then
                  new_filename="${!file_date}.${!original_filename}"
                  original_folder="(root)"
              else
                  folder_prefix=$(echo "$relative_dir" | tr '/' '.')
                  new_filename="${!file_date}.${!folder_prefix}.${!original_filename}"
                  original_folder="$relative_dir"
              fi

              log "Processing: $original_filename -> $new_filename"

              # Retry loop with exponential backoff
              success=false
              for attempt in $(seq 1 $MAX_RETRIES); do
                  s3_output=$(aws s3 mv "$file" "s3://$S3_BUCKET/incoming/$new_filename" 2>&1)
                  if [ $? -eq 0 ]; then
                      success=true
                      break
                  fi
                  [ ! -f "$file" ] && { log "File gone (moved by another process?): $original_filename"; success=true; break; }
                  sleep_time=$((attempt * 5))
                  log "Retry $attempt/$MAX_RETRIES for $original_filename (waiting ${!sleep_time}s): $s3_output"
                  sleep $sleep_time
              done

              if $success; then
                  log "Successfully moved $original_filename to S3 as $new_filename"
                  log_to_cloudwatch "FILE_TRANSFER | folder=$original_folder | file=$original_filename | dest=$new_filename | status=SUCCESS"
              else
                  log "FAILED after $MAX_RETRIES retries: $original_filename - $s3_output"
                  log_to_cloudwatch "FILE_TRANSFER | folder=$original_folder | file=$original_filename | dest=$new_filename | status=FAILED | error=$s3_output"
              fi
          done

          log "FTP to S3 sync completed"
          EOFSCRIPT

          # Note: Variables ${FTPUser} and ${S3BucketName} are substituted by CloudFormation !Sub
          chmod +x /usr/local/bin/ftp-to-s3.sh

          #add firewall exceptions for FTP ports
          #ufw allow 21000-21100/tcp
          #ufw allow 29720/tcp

          # Create log file
          touch /var/log/ftp-to-s3.log
          chmod 644 /var/log/ftp-to-s3.log

          # Wait for vsftpd to start
          sleep 3

          # Add cron job (runs every 2 minutes)
          echo "*/2 * * * * /usr/local/bin/ftp-to-s3.sh" | crontab -
          systemctl start cron
          systemctl enable cron

          # Schedule one-time vsftpd restart
          echo "systemctl restart vsftpd" | at now + 1 minute

          echo "UserData completed"

      Tags:
      - Key: Name
        Value: FTP-Server

Outputs:
  InstanceId:
    Condition: IsFTPServerEnabled
    Description: EC2 Instance ID
    Value: !Ref FTPServer
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId'

  PublicIP:
    Condition: IsFTPServerEnabled
    Description: Public IP address of FTP server
    Value: !GetAtt FTPServer.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-PublicIP'

  FTPPort:
    Condition: IsFTPServerEnabled
    Description: FTP port
    Value: 29720
    Export:
      Name: !Sub '${AWS::StackName}-FTPPort'

  LogGroupName:
    Description: CloudWatch Log Group name
    Value: !Ref FTPLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroup'

  EFSFileSystemId:
    Description: EFS FileSystem ID for FTP staging
    Value: !Ref FTPFileSystem
    Export:
      Name: !Sub '${AWS::StackName}-EFSFileSystemId'
