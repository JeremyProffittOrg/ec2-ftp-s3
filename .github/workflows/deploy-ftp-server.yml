name: Retire FTP server
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ftp-server-production
  cancel-in-progress: false
jobs:
  retire:
    if: github.ref == 'refs/heads/main' && github.repository == 'JeremyProffittOrg/ec2-ftp-s3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact retirement guards
        run: python -m unittest discover -s scripts -p 'test_retire_ftp.py'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-ftp-retirement-${{ github.run_id }}
          aws-region: us-east-2
          allowed-account-ids: '759775734231'
      - name: Retire instance and disk, preserve shared S3 and staging EFS
        run: python scripts/retire_ftp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftp-retirement-evidence
          path: retirement-evidence.json
          if-no-files-found: warn
